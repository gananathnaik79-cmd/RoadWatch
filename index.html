<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadWatch</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div style="height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0f172a,#1e293b);">
        <div style="text-align:center; color:white;">
            <div style="font-size:4rem; margin-bottom:20px;">
                <i class="fas fa-car-side" style="color:#ef4444;"></i>
            </div>
            <h1 style="font-family:'Poppins',sans-serif; font-size:2.5rem;">RoadWatch</h1>
            <p style="color:#94a3b8; margin:10px 0 30px;">Vehicle Crime Awareness & Incident Monitoring</p>
            <div style="font-size:2rem;">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <p style="margin-top:20px; color:#64748b;">Loading...</p>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        window.supabaseClient.auth.getSession().then(function(result) {
            if (result.data.session) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
