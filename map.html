<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Map - RoadWatch</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">
                <i class="fas fa-car-side"></i>
                RoadWatch
            </a>
            
            <button class="mobile-toggle" onclick="document.getElementById('navMenu').classList.toggle('active')">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="nav-menu" id="navMenu">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="map.html" class="nav-link active">
                    <i class="fas fa-map-marked-alt"></i> Crime Map
                </a>
                <a href="search.html" class="nav-link">
                    <i class="fas fa-search"></i> Search
                </a>
                <a href="statistics.html" class="nav-link">
                    <i class="fas fa-chart-bar"></i> Statistics
                </a>
                <a href="incidents.html" class="nav-link">
                    <i class="fas fa-exclamation-triangle"></i> Incidents
                </a>
                <a href="report.html" class="nav-link">
                    <i class="fas fa-pen"></i> Report
                </a>
            </div>
            
            <div class="nav-user">
                <span class="user-email" id="userEmail"></span>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="map-container">
        <div class="map-filters">
            <h3 style="margin-bottom:16px;">
                <i class="fas fa-filter" style="color:#ef4444;"></i> Filters
            </h3>
            
            <div class="form-group">
                <label>Severity</label>
                <select id="severityFilter" class="form-control" onchange="applyFilters()">
                    <option value="">All Severities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Crime Type</label>
                <select id="crimeTypeFilter" class="form-control" onchange="applyFilters()">
                    <option value="">All Types</option>
                </select>
            </div>
            
            <div class="legend">
                <h4 style="margin-bottom:12px;">Legend</h4>
                <div class="legend-item">
                    <span class="legend-dot" style="background:#ef4444;"></span>
                    High Severity
                </div>
                <div class="legend-item">
                    <span class="legend-dot" style="background:#f59e0b;"></span>
                    Medium Severity
                </div>
                <div class="legend-item">
                    <span class="legend-dot" style="background:#10b981;"></span>
                    Low Severity
                </div>
            </div>
        </div>
        
        <div id="map" class="map-view"></div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map;
        var allMarkers = [];
        var allIncidents = [];
        var supabaseClient;

        window.addEventListener('load', function() {
            
            // Create Supabase client
            supabaseClient = window.supabase.createClient(
                'https://rrmhrxfnakeizqbwkgdc.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJybWhyeGZuYWtlaXpxYndrZ2RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNzM2OTUsImV4cCI6MjEwMjk0OTY5NX0.dngDwQGHif4nsdI62PeNwpJTnAXBhMK3pxaXcjjEDbk'
            );
            
            // Check auth
            supabaseClient.auth.getSession().then(function(result) {
                if (result.data && result.data.session) {
                    document.getElementById('userEmail').textContent = result.data.session.user.email;
                    initMap();
                } else {
                    window.location.href = 'login.html';
                }
            });
        });

        function logout() {
            if (supabaseClient) {
                supabaseClient.auth.signOut().then(function() {
                    window.location.href = 'login.html';
                });
            }
        }

        function initMap() {
            map = L.map('map').setView([-25.2744, 133.7751], 4);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);
            
            loadIncidents();
        }

        async function loadIncidents() {
            try {
                var result = await supabaseClient
                    .from('roadwatch_incidents')
                    .select('*')
                    .not('latitude', 'is', null)
                    .not('longitude', 'is', null);
                
                if (result.error) throw result.error;
                
                allIncidents = result.data || [];
                
                populateCrimeTypes();
                addMarkers(allIncidents);
                
                if (allIncidents.length > 0) {
                    var bounds = L.latLngBounds(
                        allIncidents.map(function(i) { return [i.latitude, i.longitude]; })
                    );
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
                
            } catch (error) {
                console.error('Map error:', error);
            }
        }

        function populateCrimeTypes() {
            var select = document.getElementById('crimeTypeFilter');
            var types = {};
            
            allIncidents.forEach(function(i) {
                if (i.crime_type) types[i.crime_type] = true;
            });
            
            Object.keys(types).forEach(function(type) {
                var option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                select.appendChild(option);
            });
        }

        function addMarkers(incidents) {
            allMarkers.forEach(function(m) { map.removeLayer(m); });
            allMarkers = [];
            
            incidents.forEach(function(incident) {
                var color = getSeverityColor(incident.incident_severity);
                
                var icon = L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="width:20px; height:20px; border-radius:50%; background:' + color + '; border:3px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                
                var marker = L.marker([incident.latitude, incident.longitude], { icon: icon });
                
                var popupContent = 
                    '<strong>' + (incident.crime_type || 'Unknown') + '</strong><br>' +
                    'Date: ' + (incident.incident_date || 'N/A') + '<br>' +
                    'Suburb: ' + (incident.suburb || 'N/A') + '<br>' +
                    'Vehicle: ' + (incident.car_make || 'N/A') + ' ' + (incident.car_model || '') + '<br>' +
                    'Severity: ' + (incident.incident_severity || 'N/A') + '<br>' +
                    'Status: ' + (incident.verification_status || 'N/A');
                
                marker.bindPopup(popupContent);
                marker.addTo(map);
                allMarkers.push(marker);
            });
        }

        function applyFilters() {
            var severity = document.getElementById('severityFilter').value;
            var crimeType = document.getElementById('crimeTypeFilter').value;
            
            var filtered = allIncidents.filter(function(i) {
                var matchSeverity = !severity || i.incident_severity === severity;
                var matchType = !crimeType || i.crime_type === crimeType;
                return matchSeverity && matchType;
            });
            
            addMarkers(filtered);
        }

        function getSeverityColor(severity) {
            if (!severity) return '#10b981';
            switch(severity.toLowerCase()) {
                case 'high': return '#ef4444';
                case 'medium': return '#f59e0b';
                default: return '#10b981';
            }
        }
    </script>
</body>
</html>
