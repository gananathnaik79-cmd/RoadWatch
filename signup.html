<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RoadWatch</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1>RoadWatch</h1>
                <p>Join the Community Watch</p>
            </div>

            <h2 style="text-align:center; margin-bottom:24px; font-family:'Poppins',sans-serif;">
                <i class="fas fa-user-plus" style="color:#ef4444;"></i> 
                Create Account
            </h2>

            <form id="signupForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create a password (min 6 characters)" required minlength="6">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required minlength="6">
                </div>

                <div id="error-message" class="error-message" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
                </div>

                <div id="success-message" class="success-message" style="display:none;">
                    <i class="fas fa-check-circle"></i> <span id="successText"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="signupButton">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <p style="text-align:center; margin-top:20px; color:#64748b;">
                Already have an account? 
                <a href="login.html" style="color:#ef4444; font-weight:600;">Login</a>
            </p>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var errorDiv = document.getElementById('error-message');
            var errorText = document.getElementById('errorText');
            var successDiv = document.getElementById('success-message');
            var successText = document.getElementById('successText');
            var signupButton = document.getElementById('signupButton');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (password !== confirmPassword) {
                errorDiv.style.display = 'block';
                errorText.textContent = 'Passwords do not match';
                return;
            }
            
            signupButton.disabled = true;
            signupButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
            
            try {
                var result = await window.supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });
                
                if (result.error) throw result.error;
                
                successDiv.style.display = 'block';
                successText.textContent = 'Account created successfully! Check your email if confirmation is required.';
                
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                errorDiv.style.display = 'block';
                errorText.textContent = error.message || 'Signup failed';
                signupButton.disabled = false;
                signupButton.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });
    </script>
</body>
</html>
