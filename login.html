<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RoadWatch</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-car-side"></i>
                </div>
                <h1>RoadWatch</h1>
                <p>Vehicle Crime Awareness & Incident Monitoring</p>
            </div>

            <h2 style="text-align:center; margin-bottom:24px; font-family:'Poppins',sans-serif;">
                <i class="fas fa-sign-in-alt" style="color:#ef4444;"></i> 
                Login to Your Account
            </h2>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                        <button type="button" onclick="togglePassword()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#64748b;">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div id="error-message" class="error-message" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="loginButton">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <p style="text-align:center; margin-top:20px; color:#64748b;">
                Don't have an account? 
                <a href="signup.html" style="color:#ef4444; font-weight:600;">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        function togglePassword() {
            var passwordInput = document.getElementById('password');
            var eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var errorDiv = document.getElementById('error-message');
            var errorText = document.getElementById('errorText');
            var loginButton = document.getElementById('loginButton');
            
            errorDiv.style.display = 'none';
            
            loginButton.disabled = true;
            loginButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            
            try {
                var result = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (result.error) throw result.error;
                
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                errorDiv.style.display = 'block';
                errorText.textContent = error.message || 'Login failed';
                loginButton.disabled = false;
                loginButton.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });
    </script>
</body>
</html>
